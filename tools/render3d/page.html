<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
<script type="importmap">{"imports": {"three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Escena de estudio: luz principal cálida, luz de contorno blanca y cielo suave, como los renders de los hits.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const size = Number(q.get('size') || 1024);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(size, size);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x88aaff, 1.6));
const key = new THREE.DirectionalLight(0xfff1dd, 2.4);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 2.0);
rim.position.set(-4, 3, -4);
scene.add(rim);

try {
  const gltf = await new GLTFLoader().loadAsync('/model/' + q.get('model'));
  const obj = gltf.scene;
  scene.add(obj);
  const box = new THREE.Box3().setFromObject(obj);
  obj.position.sub(box.getCenter(new THREE.Vector3()));
  const s = box.getSize(new THREE.Vector3());
  const radius = Math.max(s.x, s.y, s.z);
  const cam = new THREE.PerspectiveCamera(30, 1, radius / 100, radius * 100);
  const yaw = Number(q.get('yaw') || 30) * Math.PI / 180;
  const pitch = Number(q.get('pitch') || 14) * Math.PI / 180;
  const dist = radius * Number(q.get('distance') || 3.4);
  cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
  cam.lookAt(0, 0, 0);
  renderer.render(scene, cam);
  window.__done = 'ok';
} catch (e) {
  window.__done = 'error: ' + e.message;
}
</script>
</body>
</html>
